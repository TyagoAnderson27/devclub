<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./estilo.css">
    <title>Câmbio - Conversor de Moedas</title>
</head>

<body>

    <!-- Logo principal do site -->
    <img class="logo" src="./assets/logo (1).gif" alt="Logo do site">

        <!-- Container com os dois espaços reservados que o JavaScript vai controlar -->
    <div class="moedas-container">
        <img id="from-currency-icon" src="./assets/real.png" alt="Moeda Origem">
        <img id="to-currency-icon" src="./assets/dolar.png" alt="Moeda Destino">
    </div>

    <!-- Caixa principal do conversor -->
    <main>
        <h1>Conversor de Moedas</h1>
        
        <form id="currency-form">
            <label for="amount">Valor:</label>
            <input type="number" id="amount" name="amount" placeholder="Digite o valor" step="0.01" required>

            <label for="from-currency">De:</label>
            <select id="from-currency" name="from-currency" required>
                <option value="">Selecione a moeda de origem</option>
                <option value="BRL">Real Brasileiro (BRL)</option>
                <option value="USD">Dólar Americano (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="GBP">Libra Esterlina (GBP)</option>
                <option value="BTC">Bitcoin (BTC)</option>
            </select>

            <label for="to-currency">Para:</label>
            <select id="to-currency" name="to-currency" required>
                <option value="">Selecione a moeda de destino</option>
                <option value="BRL">Real Brasileiro (BRL)</option>
                <option value="USD">Dólar Americano (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="GBP">Libra Esterlina (GBP)</option>
                <option value="BTC">Bitcoin (BTC)</option>
            </select>

            <button type="submit">Converter</button>
        </form>

        <!-- O resultado calculado aparecerá aqui -->
        <div id="result">O resultado aparecerá aqui.</div>
    </main>

    <!-- Script de lógica -->
    <script src="./script.js"></script>

</body>

</html>
